version: "3.8"

services:
  postgres:
    image: postgres:15
    container_name: exam_postgres
    environment:
      POSTGRES_DB: examdb
      POSTGRES_USER: examuser
      POSTGRES_PASSWORD: exampass
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./docker/postgres/init.sql:/docker-entrypoint-initdb.d/init.sql
    networks:
      - exam_network
    restart: unless-stopped

  backend:
    build: ./backend
    container_name: exam_backend
    depends_on:
      - postgres
    environment:
      DATABASE_URL: postgresql://examuser:exampass@postgres:5432/examdb
      SECRET_KEY: change-this-to-a-random-secret-key
      DEBUG: "true"
    ports:
      - "8000:8000"
    volumes:
      - ./backend:/app
    networks:
      - exam_network
    restart: unless-stopped

  frontend:
    build: ./frontend
    container_name: exam_frontend
    depends_on:
      - backend
    ports:
      - "80:80"
    volumes:
      - ./docker/nginx/nginx.conf:/etc/nginx/conf.d/default.conf
    networks:
      - exam_network
    restart: unless-stopped

volumes:
  postgres_data:

networks:
  exam_network:
    driver: bridge
